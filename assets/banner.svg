<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="handoff: pick up exactly where you left off, across /clear, restarts and compaction">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121931"/>
      <stop offset="1" stop-color="#22305E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.05" r="0.7">
      <stop offset="0" stop-color="#FFC43D" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FFC43D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="24" fill="url(#glow)"/>

  <!-- Icon: one session hands its notes to the next -->
  <g transform="translate(36,47) scale(0.38)">
    <rect x="170" y="250" width="390" height="520" rx="48" fill="#4662A8"/>
    <rect x="464" y="254" width="390" height="520" rx="48" fill="#F0F4FF"/>
    <rect x="530" y="360" width="260" height="34" rx="17" fill="#4662A8"/>
    <rect x="530" y="450" width="180" height="34" rx="17" fill="#4662A8"/>
    <rect x="530" y="540" width="260" height="34" rx="17" fill="#4662A8"/>
    <rect x="530" y="630" width="180" height="34" rx="17" fill="#4662A8"/>
    <polygon points="300,470 430,470 430,410 520,510 430,610 430,550 300,550" fill="#FFC43D"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="420" y="150" font-size="88" font-weight="700" fill="#FFFFFF" letter-spacing="-1">handoff</text>
    <text x="424" y="204" font-size="30" font-weight="600" fill="#FFC43D">Pick up exactly where you left off.</text>
    <text x="424" y="244" font-size="24" fill="#C3CDEE">Claude saves your work before /clear. The next session already knows it.</text>

    <g font-size="17" font-weight="600">
      <rect x="424" y="276" width="196" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="522" y="301" text-anchor="middle" fill="#E6EBFF">Claude Code plugin</text>
      <rect x="634" y="276" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="718" y="301" text-anchor="middle" fill="#E6EBFF">Runs locally</text>
      <rect x="816" y="276" width="168" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="900" y="301" text-anchor="middle" fill="#E6EBFF">No setup</text>
      <rect x="998" y="276" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="1062" y="301" text-anchor="middle" fill="#E6EBFF">MIT</text>
    </g>
  </g>
</svg>
